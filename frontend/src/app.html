<!doctype html>
<html lang="es" class="h-full">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0e7490" />
		<title>VentaSys POS</title>
		<script>
			// Se aplica el tema antes del primer pintado: sin esto la caja parpadea
			// en blanco cada vez que se navega, que a oscuras molesta de verdad.
			(function () {
				try {
					var stored = localStorage.getItem('ventasys-theme');
					var theme =
						stored === 'light' || stored === 'dark'
							? stored
							: window.matchMedia('(prefers-color-scheme: dark)').matches
								? 'dark'
								: 'light';
					document.documentElement.dataset.theme = theme;
				} catch (e) {
					document.documentElement.dataset.theme = 'light';
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="h-full">
		<div style="display: contents" class="h-full">%sveltekit.body%</div>
	</body>
</html>
